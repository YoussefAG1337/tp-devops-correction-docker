name: CD Docker images

on:
  # Cross-workflow equivalent of needs: test-backend.
  # Completion alone is insufficient: the job also checks the CI conclusion below.
  workflow_run:
    workflows: [CI DevOps]
    types: [completed]
    branches: [main]

permissions:
  contents: read

defaults:
  run:
    shell: bash

# Let an active publication finish before starting another main publication.
concurrency:
  group: docker-publication-main
  cancel-in-progress: false

jobs:
  build-and-push-docker-image:
    # workflow_run has access to secrets, so accept only successful, trusted main pushes.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: simple-api
            context: ./simple-api
          - image: database
            context: ./database
          - image: httpd
            context: ./http-server
    steps:
      - name: Checkout the commit that passed CI
        uses: actions/checkout@v4
        with:
          # workflow_run's github.sha may differ from the revision that passed CI.
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Check that this is still the current main commit
        id: revision
        env:
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          current_main="$(git ls-remote --exit-code origin refs/heads/main | cut -f1)"
          if [[ "$current_main" == "$TESTED_SHA" ]]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "::notice::A newer main commit exists; skipping this stale publication."
          fi

      - name: Check Docker Hub configuration
        if: steps.revision.outputs.current == 'true'
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          for required in DOCKERHUB_USERNAME DOCKERHUB_TOKEN; do
            if [[ -z "${!required}" ]]; then
              echo "::error::Configure $required in repository Actions secrets."
              exit 1
            fi
          done
          # Docker image namespaces must be lowercase.
          if [[ "$DOCKERHUB_USERNAME" != "${DOCKERHUB_USERNAME,,}" ]]; then
            echo "::error::DOCKERHUB_USERNAME must be your lowercase Docker Hub username."
            exit 1
          fi

      - name: Set up Docker Buildx
        if: steps.revision.outputs.current == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        if: steps.revision.outputs.current == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and publish ${{ matrix.image }}
        if: steps.revision.outputs.current == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          # A moving tag for convenience and an immutable source revision for traceability.
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/tp-devops-${{ matrix.image }}:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/tp-devops-${{ matrix.image }}:sha-${{ github.event.workflow_run.head_sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.event.workflow_run.head_sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
