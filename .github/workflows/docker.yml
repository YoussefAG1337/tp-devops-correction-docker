name: CD Docker images

on:
  # Publish only after the backend and frontend CI jobs both succeed.
  # Completion alone is insufficient: the job also checks the CI conclusion below.
  workflow_run:
    workflows: [CI DevOps]
    types: [completed]
    branches: [main]

permissions:
  contents: read

defaults:
  run:
    shell: bash

# Let an active publication finish before starting another main publication.
concurrency:
  group: docker-publication-main
  cancel-in-progress: false

jobs:
  build-and-push-docker-image:
    # workflow_run has access to secrets, so accept only successful, trusted main pushes.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: simple-api
            context: ./simple-api
          - image: database
            context: ./database
          - image: httpd
            context: ./http-server
          - image: frontend
            context: ./frontend
    steps:
      - name: Checkout the commit that passed CI
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # workflow_run's github.sha may differ from the revision that passed CI.
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Check that this is still the current main commit
        id: revision
        env:
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          current_main="$(git ls-remote --exit-code origin refs/heads/main | cut -f1)"
          if [[ "$current_main" == "$TESTED_SHA" ]]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "::notice::A newer main commit exists; skipping this stale publication."
          fi

      - name: Check Docker Hub configuration
        if: steps.revision.outputs.current == 'true'
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          for required in DOCKERHUB_USERNAME DOCKERHUB_TOKEN; do
            if [[ -z "${!required}" ]]; then
              echo "::error::Configure $required in repository Actions secrets."
              exit 1
            fi
          done
          # Docker image namespaces must be lowercase.
          if [[ "$DOCKERHUB_USERNAME" != "${DOCKERHUB_USERNAME,,}" ]]; then
            echo "::error::DOCKERHUB_USERNAME must be your lowercase Docker Hub username."
            exit 1
          fi

      - name: Set up Docker Buildx
        if: steps.revision.outputs.current == 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to Docker Hub
        if: steps.revision.outputs.current == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and publish ${{ matrix.image }}
        if: steps.revision.outputs.current == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          push: true
          # A moving tag for convenience and an immutable source revision for traceability.
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/tp-devops-${{ matrix.image }}:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/tp-devops-${{ matrix.image }}:sha-${{ github.event.workflow_run.head_sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.event.workflow_run.head_sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  deploy:
    needs: build-and-push-docker-image
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout the commit that passed CI
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Check deployment revision
        id: revision
        env:
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          current_main="$(git ls-remote --exit-code origin refs/heads/main | cut -f1)"
          if [[ "$current_main" == "$TESTED_SHA" ]]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping deployment because main has a newer commit."
          fi

      - name: Install Ansible and collections
        if: steps.revision.outputs.current == 'true'
        run: |
          python3 -m venv "$RUNNER_TEMP/ansible-venv"
          "$RUNNER_TEMP/ansible-venv/bin/pip" install ansible-core
          "$RUNNER_TEMP/ansible-venv/bin/ansible-galaxy" collection install \
            -r ansible/requirements.yml

      - name: Configure SSH
        if: steps.revision.outputs.current == 'true'
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          test -n "$SSH_PRIVATE_KEY"
          test -n "$SSH_KNOWN_HOSTS"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/id_rsa"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_rsa" "$HOME/.ssh/known_hosts"
          ssh-keygen -y -P '' -f "$HOME/.ssh/id_rsa" > /dev/null

      - name: Deploy application
        if: steps.revision.outputs.current == 'true'
        working-directory: ansible
        env:
          DATABASE_PASSWORD: ${{ secrets.DATABASE_PASSWORD }}
          IMAGE_TAG: sha-${{ github.event.workflow_run.head_sha }}
          ANSIBLE_HOST_KEY_CHECKING: "True"
          ANSIBLE_SSH_ARGS: "-o StrictHostKeyChecking=yes"
        run: |
          "$RUNNER_TEMP/ansible-venv/bin/ansible-playbook" \
            -i inventories/setup.yml playbook.yml --syntax-check
          "$RUNNER_TEMP/ansible-venv/bin/ansible-playbook" \
            -i inventories/setup.yml playbook.yml

      - name: Verify API responds
        if: steps.revision.outputs.current == 'true'
        run: |
          curl --fail --silent --show-error \
            --connect-timeout 10 --max-time 20 \
            --retry 12 --retry-delay 5 --retry-all-errors \
            http://youssef.agrebaoui.takima.school/api/departments

      - name: Verify frontend responds
        if: steps.revision.outputs.current == 'true'
        run: |
          curl --fail --silent --show-error \
            --connect-timeout 10 --max-time 20 \
            --retry 12 --retry-delay 5 --retry-all-errors \
            http://youssef.agrebaoui.takima.school/ \
            -o "$RUNNER_TEMP/frontend.html"
          grep -Eq 'id=("app"|app)([[:space:]>])' "$RUNNER_TEMP/frontend.html"

      - name: Remove deployment key
        if: always()
        run: rm -f "$HOME/.ssh/id_rsa"
