name: CI DevOps

on:
  # The fork's default branch is main (called master in part of the handout).
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

# Tests need repository read access only.
permissions:
  contents: read

jobs:
  test-backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: simple-api/pom.xml

      # Failsafe starts the Testcontainers PostgreSQL integration tests.
      - name: Build and test with Maven
        run: mvn --batch-mode --no-transfer-progress clean verify --file simple-api/pom.xml

      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: |
            simple-api/target/surefire-reports/
            simple-api/target/failsafe-reports/
            simple-api/target/site/jacoco/
          retention-days: 14

  build-and-push-docker-image:
    # Checkpoint 2 first verifies the builds; publishing is added in the split CD workflow.
    needs: test-backend
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: simple-api
            context: ./simple-api
          - image: database
            context: ./database
          - image: httpd
            context: ./http-server
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.image }} image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          tags: tp-devops-${{ matrix.image }}:ci-${{ github.sha }}
          push: false
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
