name: CI DevOps

on:
  # The fork's default branch is main (called master in part of the handout).
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

# Tests need repository read access only.
permissions:
  contents: read

jobs:
  test-backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # SonarCloud needs history to identify new code accurately.
          fetch-depth: 0
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: simple-api/pom.xml

      # Failsafe starts the Testcontainers PostgreSQL integration tests.
      - name: Build and test with Maven
        run: mvn --batch-mode --no-transfer-progress clean verify --file simple-api/pom.xml

      # Free-tier analysis covers main and trusted PRs targeting main.
      # Fork PRs still run the tests but never receive analysis credentials.
      - name: SonarCloud analysis and quality gate
        if: >-
          github.ref == 'refs/heads/main' ||
          (github.event_name == 'pull_request' &&
           github.base_ref == 'main' &&
           github.event.pull_request.head.repo.full_name == github.repository)
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
        run: |
          # Fail visibly when setup is incomplete instead of silently skipping the gate.
          for required in SONAR_TOKEN SONAR_ORGANIZATION SONAR_PROJECT_KEY; do
            if [[ -z "${!required}" ]]; then
              echo "::error::Configure $required in repository Actions secrets/variables."
              exit 1
            fi
          done

          # Reuse the bytecode, test reports and JaCoCo XML from clean verify above.
          # SONAR_TOKEN stays in the environment, never in a command-line argument.
          mvn --batch-mode --no-transfer-progress \
            org.sonarsource.scanner.maven:sonar-maven-plugin:5.8.0.7211:sonar \
            --file simple-api/pom.xml \
            "-Dsonar.projectKey=$SONAR_PROJECT_KEY" \
            "-Dsonar.organization=$SONAR_ORGANIZATION" \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.qualitygate.wait=true \
            -Dsonar.qualitygate.timeout=300

      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: |
            simple-api/target/surefire-reports/
            simple-api/target/failsafe-reports/
            simple-api/target/site/jacoco/
          retention-days: 14

  build-and-push-docker-image:
    # Checkpoint 2 first verifies the builds; publishing is added in the split CD workflow.
    needs: test-backend
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: simple-api
            context: ./simple-api
          - image: database
            context: ./database
          - image: httpd
            context: ./http-server
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.image }} image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          tags: tp-devops-${{ matrix.image }}:ci-${{ github.sha }}
          push: false
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
