services:

  database:
    build: "database"
    environment:
      - POSTGRES_PASSWORD=pwd
    volumes:
      - db-volume:/var/lib/postgresql/data
    networks:
      - backend-network

  simple-api:
    build: "simple-api"
    environment:
      - DATABASE_HOST=database
      - DATABASE_PASSWORD=pwd
    networks:
      - backend-network
      - frontend-network

  frontend:
    build: "frontend"
    networks:
      - frontend-network

  httpd:
    build: "http-server"
    ports:
      - "80:80"
    networks:
      - frontend-network
    depends_on:
      - simple-api
      - frontend

networks:
  frontend-network:
  backend-network:

volumes:
  db-volume :
